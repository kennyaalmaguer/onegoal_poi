<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&family=Mansalva&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=clash-display@200,300,500,600,700&display=swap"
        rel="stylesheet">


    <link href="https://api.fontshare.com/v2/css?f[]=panchang@700,800&f[]=technor@900&display=swap" rel="stylesheet">


    <title>ONE GOAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>
    <!-- Panel izquierdo con lista de chats (100% en móvil) -->
    <div class="chats-panel" id="chatsPanel">
        <div class="header-left">
            <div class="user-info">
                <div><a href="index.html" class="logo-link">ONEGOAL</a></div>
            </div>
            <!-- Botón para crear grupos en lugar del indicador de estado -->
            <button class="create-group-btn" id="createGroupBtn">
                <i class="fas fa-plus"></i>
            </button>
        </div>


        <div class="buttons-container">
            <button class="round-button active" data-tab="conversations">Conversaciones</button>
            <button class="round-button" data-tab="groups">Grupos</button>
            <button class="round-button" data-tab="calls">Llamadas</button>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" placeholder="Buscar o empezar un chat nuevo">
        </div>

        <!-- Lista de conversaciones -->
        <div class="chats-list" id="conversationsList">

        </div>

        <!-- Lista de grupos (oculta por defecto) -->
        <div class="chats-list" id="groupsList" style="display: none;">
     
        </div>

        <!-- Lista de llamadas (oculta por defecto) -->
        <div class="chats-list" id="callsList" style="display: none;">
           
        

        


        </div>
    </div>

    <!-- Panel derecho con el chat seleccionado (oculto en móvil por defecto) -->
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="contact-info">
                <button class="back-button" id="backButton">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="user-avatar" id="userAvatar"></div>
                <div>
                    <div class="chat-name" id="userName"></div>
                    <div class="chat-status" id="userStatus"></div>
                </div>
            </div>
            <div class="contact-actions">
                <i class="fas fa-video" id="videoCallBtn"></i>
                <i class="fas fa-phone" id="voiceCallBtn"></i>
                <i class="fas fa-lock" id="lockBtn"></i>
            </div>
        </div>
        <div class="empty-chat" id="emptyChat">
            <p>Busca un usuario para empezar a chatear </p>
        </div>

        <div class="messages" id="messagesContainer">



        </div>

        <div class="input-container">
            <i class="fa-solid fa-location-dot" id="Ubicacion"></i>
            <input type="file" id="fileInput" style="display:none" accept="*/*">
            <i class="fas fa-paperclip" id="attachBtn"></i>
            <input type="text" class="message-input" id="messageInput" placeholder="Escribe un mensaje">
            <i class="	fas fa-microphone" id="recordBtn"></i>
        
            <button class="send-button" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>


    <!-- Modal para crear grupos -->
    <div id="createGroupModal" class="call-modal">
        <div class="call-content">
            <h2>Crear nuevo grupo</h2>
            <p>Esta funcionalidad te llevará a la página de creación de grupos.</p>
            <button class="hangup-btn" id="confirmCreateGroup">
                <i class="fas fa-check"></i>
            </button>
        </div>
    </div>

    <!-- Modal de llamada de voz -->
    <div id="voiceCallModal" class="call-modal">
        <div class="call-content">
            <div class="caller-info">
                <div class="caller-avatar"  id="voiceCallerAvatar">M</div>
                <h2>Lionel Messi</h2>
                <p class="call-status" id="voiceCallStatus">Llamando...</p>
            </div>
            <div class="call-controls">
                <button class="call-btn" id="muteBtn">
                    <i class="fas fa-microphone"></i>
                    <span>Mute</span>
                </button>
                <button class="call-btn hangup" id="hangupVoiceCall">
                    <i class="fas fa-phone-slash"></i>
                    <span>Colgar</span>
                </button>
                <button class="call-btn" id="speakerBtn">
                    <i class="fas fa-volume-up"></i>
                    <span>Speaker</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de videollamada -->
    <div id="videoCallModal" class="call-modal">
        <div class="call-content">
            <div class="video-container">
                <div class="remote-video">
                    <!-- Video del contacto -->
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-placeholder" id="remotePlaceholder">
                        <div class="caller-avatar">M</div>
                        <p>Lionel Messi</p>
                    </div>
                </div>
                <div class="local-video">
                    <!-- Tu video -->
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="video-placeholder small" id="localPlaceholder">
                        <div class="caller-avatar" id="localAvatar">Tú</div>
                    </div>
                </div>
            </div>
            <div class="call-controls">
                <button class="call-btn" id="videoMuteBtn">
                    <i class="fas fa-video"></i>
                    <span>Video</span>
                </button>
                <button class="call-btn" id="videoAudioMuteBtn">
                    <i class="fas fa-microphone"></i>
                    <span>Mute</span>
                </button>
                <button class="call-btn hangup" id="hangupVideoCall">
                    <i class="fas fa-phone-slash"></i>
                    <span>Colgar</span>
                </button>
                <button class="call-btn" id="videoSpeakerBtn">
                    <i class="fas fa-volume-up"></i>
                    <span>Speaker</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de llamada entrante -->
    <div id="incomingCallModal" class="call-modal">
        <div class="call-content">
            <div class="caller-info">
                <div class="caller-avatar"  id="incomingCallerAvatar">M</div>
                <h2>Lionel Messi</h2>
                <p class="call-status" id="incomingCallStatus">Llamada entrante...</p>
            </div>
            <div class="call-controls">
                <button class="call-btn decline" id="declineCall">
                    <i class="fas fa-phone-slash"></i>
                    <span>Rechazar</span>
                </button>
                <button class="call-btn accept" id="acceptCall">
                    <i class="fas fa-phone"></i>
                    <span>Aceptar</span>
                </button>
            </div>
        </div>
    </div>
    <!-------->
    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script src="Js/chat.js"></script>
    <script src="Js/chat_funciones.js"></script>
</body>

</html>
