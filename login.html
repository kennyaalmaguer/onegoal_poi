<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEGOAL - Login</title>
  
  <!-- Google Fonts y Banana Brick -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&family=Mansalva&display=swap" rel="stylesheet">
  <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/banana-brick" type="text/css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=clash-display@200,300,500,600,700&display=swap" rel="stylesheet">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body, html { 
      font-family: 'Poppins', sans-serif; 
      height:100%;  
      background: url("imagenes/2.png"); 
      color:white; 
      display: flex;
      flex-direction: column;
    }
    
    header {
      background: url("imagenes/2.png") no-repeat center center/cover;
      height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 20px;
      font-family: "BananaBrickRegular", sans-serif; 
    }
    
    .logo {
      font-size: 60px;
      color: white;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }
    
    .header-subtitle {
      font-size: 1rem;
      margin-top: 5px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 20px;
    }
    
    .login-box {
      background: rgba(26, 61, 124, 0.9);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
      text-align: center;
    }
    
    .login-box h2 {
      font-family: 'Chillax', sans-serif;
      font-size: 28px;
      margin-bottom: 25px;
    }
    
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .form-group {
      text-align: left;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      font-family: 'Poppins', sans-serif;
    }
    
    .login-btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00aaff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    
    .login-btn:hover {
      background: #0088cc;
    }
    
    .login-options {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 0.9rem;
    }
    
    .login-options a {
      color: #00aaff;
      text-decoration: none;
    }
    
    .login-options a:hover {
      text-decoration: underline;
    }
    
    .separator {
      margin: 20px 0;
      position: relative;
      text-align: center;
    }
    
    .separator::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255,255,255,0.3);
    }
    
    .separator span {
      background: #1A3D7C;
      padding: 0 15px;
      position: relative;
    }
    
    .social-login {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }
    
    .register-link {
      margin-top: 20px;
      font-size: 0.9rem;
    }
    
    .register-link a {
      color: #00aaff;
      text-decoration: none;
      font-weight: 600;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }
    
    footer {
      text-align: center;
      padding: 1rem;
      background-image: url("imagenes/azul2.png");
    }
    
    footer nav {
      background: transparent;
      box-shadow: none;
      margin: 0.5rem 0;
    }
    
    footer nav a {
      color: white;
      margin: 0 0.5rem;
      text-decoration: none;
      font-size: 0.8rem;
    }
    
    footer nav a:hover {
      color: #00aaff;
    }
.logo-link,
.logo-link:visited {
  color: white;
  text-decoration: none;
}


  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html" class="logo-link">ONEGOAL</a>
</div>
    <div class="header-subtitle">La plataforma definitiva para el Mundial 2026</div>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2>INICIAR SESIÓN</h2>
      <form class="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Iniciar Sesión</button>
        
        <div class="login-options">
          <label>
            <input type="checkbox"> Recordarme
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
      
      <div class="separator"><span>O</span></div>
      
      <div class="social-login">
        <button class="social-btn"><i class="fab fa-google"></i></button>
        <button class="social-btn"><i class="fab fa-facebook-f"></i></button>
      </div>
      
      <div class="register-link">
        ¿No tienes cuenta? <a href="register.html">Regístrate ahora</a>
      </div>
    </div>
  </div>

  <footer>
    <p>ONEGOAL &copy; 2025 - Plataforma de Pronósticos para el Mundial 2026</p>
    <nav>
      <a href="#">Términos y Condiciones</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
