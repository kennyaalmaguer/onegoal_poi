<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEGOAL - Login</title>

  <!-- Google Fonts y Banana Brick -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&family=Mansalva&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/banana-brick" type="text/css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link
    href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=clash-display@200,300,500,600,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">

</head>

<body>
  <header>
    <div class="logo"><a href="index.html" class="logo-link">ONEGOAL</a>
    </div>
    <div class="header-subtitle">La plataforma definitiva para el Mundial 2026</div>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2>INICIAR SESIÓN</h2>
      <form class="login-form" action="php/login.php" method="POST">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Iniciar Sesión</button>

        <div class="login-options">
          <label>
            <input type="checkbox" name="recordar"> Recordarme
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
      <div class="separator"><span>O</span></div>

      <div class="social-login">
        <button class="social-btn"><i class="fab fa-google"></i></button>
        <button class="social-btn"><i class="fab fa-facebook-f"></i></button>
      </div>

      <div class="register-link">
        ¿No tienes cuenta? <a href="register.html">Regístrate ahora</a>
      </div>
    </div>
  </div>

  <footer>
    <p>ONEGOAL &copy; 2025 - Plataforma de Pronósticos para el Mundial 2026</p>
    <nav>
      <a href="#">Términos y Condiciones</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>

</html>
