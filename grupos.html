<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEGOAL - Grupos</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/grupos.css">
</head>

<body>
  <header>
    <div class="logo">ONEGOAL</div>
    <div class="header-subtitle">La plataforma definitiva para el Mundial 2026</div>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="pronosticos.html">Pronósticos</a>
    <a href="grupos.html" class="active">Grupos</a>
    <a href="ranking.html">Ranking</a>
    <a href="tareas.html">Tareas</a>
    <a href="chat.html">Chat</a>
  </nav>

  <main class="main-content">
    <h2 class="section-title">GRUPOS</h2>

    <!-- Contenedor dinámico de grupos -->
  <div id="groupsList" class="tournaments-container"></div>

    <div class="create-tournament">
      <button class="create-btn" id="openModalBtn">Crear Grupo</button>
    </div>

    <!-- MODAL -->
   <div class="modal" id="createGroupModal">
  <div class="modal-content">
    <h3>Crear Nuevo Grupo</h3>
    <label for="groupName">Nombre del grupo:</label>
    <input type="text" id="groupName" placeholder="Ej. Amigos del Mundial">

    <label for="maxParticipants">Número máximo de participantes:</label>
    <select id="maxParticipants">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>

    <label>Selecciona participantes:</label>
    <div class="checkbox-list" id="participantsList"></div>

    <div id="selectedCounter" class="selected-counter">0/10 seleccionados</div>

    <div class="modal-actions">
      <button class="cancel-btn" id="cancelBtn">Cancelar</button>
      <button class="join-btn" id="createBtn">Crear</button>
    </div>
  </div>
</div>
  </main>

  <div class="modal" id="participantsModal">
  <div class="modal-content">
    <h3 id="participantsModalTitle"></h3>
    <div id="participantsModalList" class="participants-list"></div>
    <div class="modal-actions">
      <button class="cancel-btn" id="closeParticipantsBtn">Cerrar</button>
    </div>
  </div>
</div>
  <footer>
    <p>ONEGOAL &copy; 2025 - Plataforma de Pronósticos para el Mundial 2026</p>
    <nav>
      <a href="#">Términos y Condiciones</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>

  <script src="Js/grupos.js"></script>
</body>
</html>
