<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEGOAL - Registro</title>
  
  <!-- Google Fonts y Banana Brick -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&family=Mansalva&display=swap" rel="stylesheet">
  <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/banana-brick" type="text/css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=clash-display@200,300,500,600,700&display=swap" rel="stylesheet">
  <link ref="stylesheet" href="css/registro.css">
  

</head>
<body>
  <header>
    <div class="logo"><a href="index.html" class="logo-link">ONEGOAL</a></div>
    <div class="header-subtitle">La plataforma definitiva para el Mundial 2026</div>
  </header>

  <div class="register-container">
    <div class="register-box">
      <h2>CREAR CUENTA</h2>
      <form class="register-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="lastname">Apellido</label>
            <input type="text" id="lastname" placeholder="Tu apellido" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="country">País de origen</label>
          <select id="country" required>
            <option value="">Selecciona tu país</option>
            <option value="ar">Argentina</option>
            <option value="br">Brasil</option>
            <option value="cl">Chile</option>
            <option value="co">Colombia</option>
            <option value="mx">México</option>
            <option value="es">España</option>
            <option value="us">Estados Unidos</option>
            <option value="other">Otro</option>
          </select>
        </div>
      
        
        <div class="form-group-check">
          <input type="checkbox" id="terms" required>
          <label for="terms">Acepto los términos y condiciones y la política de privacidad</label>
        </div>
        
        <div class="form-group-check">
          <input type="checkbox" id="newsletter">
          <label for="newsletter">Deseo recibir notificaciones y novedades sobre el Mundial 2026</label>
        </div>
        
        <button type="submit" class="register-btn">Crear Cuenta</button>
      </form>
      
      <div class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>

  <footer>
    <p>ONEGOAL &copy; 2025 - Plataforma de Pronósticos para el Mundial 2026</p>
    <nav>
      <a href="#">Términos y Condiciones</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>
</body>
</html>
