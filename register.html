<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEGOAL - Registro</title>
  
  <!-- Google Fonts y Banana Brick -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&family=Mansalva&display=swap" rel="stylesheet">
  <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/banana-brick" type="text/css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=clash-display@200,300,500,600,700&display=swap" rel="stylesheet">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
     body, html { 
      font-family: 'Poppins', sans-serif; 
      
      background: url("imagenes/2.png"); 
      color:white; 
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    
    header {
      background: url("imagenes/2.png") no-repeat center center/cover;
      height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 20px;
      font-family: "BananaBrickRegular", sans-serif; 
    }
    
    .logo {
      font-size: 60px;
      color: white;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }
    
    .header-subtitle {
      font-size: 1rem;
      margin-top: 5px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    
    .register-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    
    .register-box {
      background: rgba(26, 61, 124, 0.9);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
      text-align: center;
      margin: 20px 0;
    }
    
    .register-box h2 {
      font-family: 'Chillax', sans-serif;
      font-size: 28px;
      margin-bottom: 25px;
    }
    
    .register-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .form-row {
      display: flex;
      gap: 15px;
    }
    
    .form-group {
      text-align: left;
      flex: 1;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      font-family: 'Poppins', sans-serif;
    }
    
    .form-group-check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    
    .form-group-check input {
      width: auto;
    }
    
    .register-btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00aaff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
    }
    
    .register-btn:hover {
      background: #0088cc;
    }
    
    .login-link {
      margin-top: 20px;
      font-size: 0.9rem;
    }
    
    .login-link a {
      color: #00aaff;
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    footer {
      text-align: center;
      padding: 1rem;
      background-image: url("imagenes/azul2.png");
    }
    
    footer nav {
      background: transparent;
      box-shadow: none;
      margin: 0.5rem 0;
    }
    
    footer nav a {
      color: white;
      margin: 0 0.5rem;
      text-decoration: none;
      font-size: 0.8rem;
    }
    
    footer nav a:hover {
      color: #00aaff;
    }
.logo-link,
.logo-link:visited {
  color: white;
  text-decoration: none;
}


  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html" class="logo-link">ONEGOAL</a></div>
    <div class="header-subtitle">La plataforma definitiva para el Mundial 2026</div>
  </header>

  <div class="register-container">
    <div class="register-box">
      <h2>CREAR CUENTA</h2>
      <form class="register-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="lastname">Apellido</label>
            <input type="text" id="lastname" placeholder="Tu apellido" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="country">País de origen</label>
          <select id="country" required>
            <option value="">Selecciona tu país</option>
            <option value="ar">Argentina</option>
            <option value="br">Brasil</option>
            <option value="cl">Chile</option>
            <option value="co">Colombia</option>
            <option value="mx">México</option>
            <option value="es">España</option>
            <option value="us">Estados Unidos</option>
            <option value="other">Otro</option>
          </select>
        </div>
        <!--
        <div class="form-group">
          <label for="favorite-team">Equipo favorito</label>
          <select id="favorite-team" required>
            <option value="">Selecciona tu equipo</option>
            <option value="argentina">Argentina</option>
            <option value="brasil">Brasil</option>
            <option value="españa">España</option>
            <option value="francia">Francia</option>
            <option value="alemania">Alemania</option>
            <option value="portugal">Portugal</option>
            <option value="mexico">México</option>
            <option value="other">Otro</option>
          </select>
        </div>-->
        
        <div class="form-group-check">
          <input type="checkbox" id="terms" required>
          <label for="terms">Acepto los términos y condiciones y la política de privacidad</label>
        </div>
        
        <div class="form-group-check">
          <input type="checkbox" id="newsletter">
          <label for="newsletter">Deseo recibir notificaciones y novedades sobre el Mundial 2026</label>
        </div>
        
        <button type="submit" class="register-btn">Crear Cuenta</button>
      </form>
      
      <div class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>

  <footer>
    <p>ONEGOAL &copy; 2025 - Plataforma de Pronósticos para el Mundial 2026</p>
    <nav>
      <a href="#">Términos y Condiciones</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>
</body>
</html>
