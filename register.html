<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
   <link rel="icon" href="imagenes/LOGO.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEGOAL - Registro</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&family=Mansalva&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link
    href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=clash-display@200,300,500,600,700&display=swap"
    rel="stylesheet">

 
<link href="https://api.fontshare.com/v2/css?f[]=panchang@700,800&f[]=technor@900&display=swap" rel="stylesheet">
 

  <link rel="stylesheet" href="css/registro.css">


</head>

<body>
  <header>
    <div class="logo"><a href="index.html" class="logo-link">ONEGOAL</a></div>
    <div class="header-subtitle">La plataforma definitiva para el Mundial 2026</div>
  </header>

  <div class="register-container">
    <div class="register-box">
      <h2>CREAR CUENTA</h2>
      <form class="register-form" method="POST" action="php/registro.php" enctype="multipart/form-data">
        


        <div class="form-row">


          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" name="nombre" id="name" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="lastname">Apellido</label>
            <input type="text" name="apellido" id="lastname" placeholder="Tu apellido" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" name="correo" id="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" name="confirm_password" id="confirm-password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-group">
          <label for="country">País de origen</label>
          <select name="pais" id="country" required>
            <option value="">Selecciona tu país</option>
            <option value="Argentina">Argentina</option>
            <option value="Brasil">Brasil</option>
            <option value="Chile">Chile</option>
            <option value="Colombia">Colombia</option>
            <option value="México">México</option>
            <option value="España">España</option>
            <option value="Estados Unidos">Estados Unidos</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group file-row">
  <label for="photo">Foto de perfil</label>
  <div class="file-input-wrapper">
    <input type="file" name="foto" id="photo" accept="image/*">
    <label for="photo" class="custom-file-label">Seleccionar archivo</label>
  </div>
  <img id="preview" class="preview-img" src="" alt="Previsualización" />
</div>

        <div class="form-group-check">
          <input type="checkbox" name="terms" id="terms" required>
          <label for="terms">Acepto los términos y condiciones y la política de privacidad</label>
        </div>

       


        <button type="submit" class="register-btn">Crear Cuenta</button>
      </form>

      <div class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>

  <footer>
    <p>ONEGOAL &copy; 2025 - Plataforma de Pronósticos para el Mundial 2026</p>
    <nav>
      <a href="#">Términos y Condiciones</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>
  <script src="js/register.js"></script>
</body>

</html>
